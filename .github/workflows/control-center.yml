name: Control Center

on:
  workflow_dispatch:

  schedule:
    - cron: "37 10 * * 1"

jobs:
  control-center:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: porca-madovbyk-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: porca-madovbyk-ai
        run: |
          python -m py_compile src/dashboard_report.py
          python -m py_compile src/final_advice_report.py
          python -m py_compile src/trade_engine.py
          python -m py_compile src/talent_scout_report.py
          python -m py_compile src/repair_auction_engine.py
          python -m py_compile src/repair_auction_optimizer.py

      - name: Run Control Center
        working-directory: porca-madovbyk-ai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.dashboard_report

      - name: Notify failure
        if: failure()
        working-directory: porca-madovbyk-ai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from src.telegram_bot import send_message; send_message('⚠️ <b>Control Center</b>\nErrore durante il report generale. Controlla GitHub Actions.')"
