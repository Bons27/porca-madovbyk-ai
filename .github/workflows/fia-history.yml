name: FIA History

on:
  schedule:
    - cron: "11 7 * * *"

  workflow_dispatch:
    inputs:
      matchday:
        description: "Giornata Serie A completata da forzare (lascia vuoto per rilevamento automatico)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: porca-madovbyk-fia-history
  cancel-in-progress: false

jobs:
  update-fia-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: porca-madovbyk-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: porca-madovbyk-ai
        run: |
          python -m py_compile src/player_context.py
          python -m py_compile src/fia_history.py
          python -m py_compile src/fia_history_update.py
          python -m py_compile tests/test_fia_history.py

      - name: Run FIA unit tests
        working-directory: porca-madovbyk-ai
        run: python -m unittest tests.test_fia_history

      - name: Update FIA history
        working-directory: porca-madovbyk-ai
        env:
          FIA_MATCHDAY: ${{ github.event.inputs.matchday }}
        run: python -m src.fia_history_update

      - name: Save FIA history
        working-directory: porca-madovbyk-ai
        run: |
          if [ -n "$(git status --porcelain -- data/fia_history.csv data/fia_coach_profiles.json)" ]; then
            git config user.name "Porca MaDovbyk AI"
            git config user.email "actions@github.com"

            git add data/fia_history.csv
            git add data/fia_coach_profiles.json

            git commit -m "Update FIA coach history [skip ci]"
            git push
          else
            echo "Nessun nuovo snapshot FIA da salvare."
          fi

      - name: Notify failure
        if: failure()
        working-directory: porca-madovbyk-ai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from src.telegram_bot import send_message; send_message('⚠️ <b>FIA History</b>\nErrore durante l’aggiornamento dello storico allenatori. Controlla GitHub Actions.')"
