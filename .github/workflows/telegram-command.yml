name: Telegram Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Comando da eseguire"
        required: true
        default: "/help"
        type: string

jobs:
  command:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: porca-madovbyk-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: porca-madovbyk-ai
        run: |
          python -m py_compile src/telegram_command_router.py
          python -m py_compile src/dashboard_report.py
          python -m py_compile src/final_advice_report.py
          python -m py_compile src/talent_scout_report.py
          python -m py_compile src/repair_auction_report.py
          python -m py_compile src/repair_auction_simulation_report.py
          python -m py_compile src/trade_analysis_report.py

      - name: Execute command
        working-directory: porca-madovbyk-ai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COMMAND: ${{ inputs.command }}
        run: python -m src.telegram_command_router

      - name: Notify failure
        if: failure()
        working-directory: porca-madovbyk-ai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from src.telegram_bot import send_message; send_message('⚠️ <b>Telegram Command</b>\nIl comando non è stato completato. Controlla GitHub Actions.')"
