name: Agente Automatico

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Forza un report per test"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "preliminary"
          - "final"

permissions:
  contents: write

concurrency:
  group: porca-madovbyk-auto
  cancel-in-progress: false

jobs:
  automatic-advice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: porca-madovbyk-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check deadline and generate advice
        working-directory: porca-madovbyk-ai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_FORCE: ${{ inputs.force }}
        run: python -m src.auto_advice

      - name: Save automation state
        working-directory: porca-madovbyk-ai
        run: |
          if [ -n "$(git status --porcelain -- data/automation_state.json)" ]; then
            git config user.name "Porca MaDovbyk AI"
            git config user.email "actions@github.com"

            git add data/automation_state.json

            git commit -m "Update automation state [skip ci]"

            git push
          else
            echo "Nessuno stato da aggiornare."
          fi

      - name: Notify Telegram on failure
        if: failure()
        working-directory: porca-madovbyk-ai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from src.telegram_bot import send_message; send_message('⚠️ <b>Porca MaDovbyk AI</b>\nErrore nell’automazione. Controlla GitHub Actions.')"
