name: Dashboard V5.1 Smoke Test

on:
  push:
    paths:
      - "porca-madovbyk-ai/app_v4.py"
      - "porca-madovbyk-ai/streamlit_app.py"
      - "porca-madovbyk-ai/src/build_dashboard_v5.py"
      - "porca-madovbyk-ai/src/market_proposals.py"
      - "porca-madovbyk-ai/src/market_dashboard.py"
      - "porca-madovbyk-ai/tests/test_market_proposals.py"
      - "porca-madovbyk-ai/src/player_context_v3.py"
      - "porca-madovbyk-ai/src/fia_coach_dashboard.py"
      - "porca-madovbyk-ai/src/player_detail.py"
      - "porca-madovbyk-ai/src/player_detail_dashboard.py"
      - "porca-madovbyk-ai/src/calendar_source.py"
      - "porca-madovbyk-ai/src/deadline_source.py"
      - "porca-madovbyk-ai/tests/test_player_detail.py"
      - "porca-madovbyk-ai/tests/test_calendar_source.py"
      - "porca-madovbyk-ai/.gitignore"
      - "porca-madovbyk-ai/src/decision_fia.py"
      - "porca-madovbyk-ai/src/start_score.py"
      - "porca-madovbyk-ai/src/trade_value.py"
      - "porca-madovbyk-ai/src/talent_scout_fia.py"
      - "porca-madovbyk-ai/src/talent_scout_report_fia.py"
      - ".github/workflows/fia-smoke-test.yml"

  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: porca-madovbyk-ai
        run: pip install -r requirements.txt

      - name: Build stable Dashboard V5.1
        working-directory: porca-madovbyk-ai
        run: python -m src.build_dashboard_v5

      - name: Compile stable modules
        working-directory: porca-madovbyk-ai
        run: |
          python -m py_compile streamlit_app.py
          python -m py_compile _app_runtime_v5.py
          python -m py_compile src/player_context_v3.py
          python -m py_compile src/fia_coach_dashboard.py
          python -m py_compile src/player_detail.py
          python -m py_compile src/player_detail_dashboard.py
          python -m py_compile src/market_proposals.py
          python -m py_compile src/market_dashboard.py
          python -m py_compile src/calendar_source.py
          python -m py_compile src/deadline_source.py
          python -m py_compile src/decision_fia.py
          python -m py_compile src/start_score.py
          python -m py_compile src/trade_value.py
          python -m py_compile src/talent_scout_fia.py
          python -m py_compile src/talent_scout_report_fia.py

      - name: Verify Mercato UI imports and navigation
        working-directory: porca-madovbyk-ai
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.market_dashboard import render_market
          from src.market_proposals import find_market_proposals
          from src.trade_engine import owner_value
          dashboard = Path("_app_runtime_v5.py").read_text(encoding="utf-8")
          assert '"Mercato"' in dashboard
          assert 'elif page == "Mercato":' in dashboard
          assert "render_market(PROJECT_ROOT, open_player_detail, suffix)" in dashboard
          assert '("🔁 Mercato", "Mercato",' in dashboard
          assert callable(render_market) and callable(find_market_proposals)
          print("Mercato navigation and module imports: OK")
          PY

      - name: Test Mercato conservative proposals
        working-directory: porca-madovbyk-ai
        run: python -m unittest tests.test_market_proposals -v

      - name: Probe Mercato with 200 real league players (non-blocking)
        working-directory: porca-madovbyk-ai
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from src.fantacalcio_catalog import fetch_player_catalog
          from src.fantacalcio_statistics import fetch_statistics_catalog
          from src.league_rosters import load_league_rosters
          from src.league_dataset import build_league_dataset
          from src.trade_value import build_trade_values
          from src.market_proposals import find_market_proposals
          root = Path("data")
          roster = load_league_rosters(root / "league_rosters.csv")
          dataset = build_league_dataset(roster, fetch_player_catalog(), fetch_statistics_catalog())
          print("Mercato live dataset:",len(dataset["players"]),"unmatched:",len(dataset["catalog_unmatched"]))
          assert len(dataset["players"]) == 200 and not dataset["catalog_unmatched"]
          teams = defaultdict(list)
          for p in dataset["players"]:
              teams[p.fantasy_team].append(p)
          values = build_trade_values(dataset["players"], {}, {})
          result = find_market_proposals(dict(teams), values)
          print("Mercato live offers:",len(result["offers"]))
          for offer in result["offers"]:
              print("OFFER",offer["opponent"],
                    [(p.name, p.role, p.fvmp, p.games_with_vote, round(owner_value(p,values),1)) for p in offer["give"]],
                    [(p.name, p.role, p.fvmp, p.games_with_vote, round(owner_value(p,values),1)) for p in offer["receive"]],
                    offer["my_gain"],offer["opponent_gain"])
          PY

      - name: Test player detail parser
        working-directory: porca-madovbyk-ai
        run: python -m unittest tests.test_player_detail -v

      - name: Test Serie A matchday resolver
        working-directory: porca-madovbyk-ai
        run: python -m unittest tests.test_calendar_source -v

      - name: Historical round regression (fixed offline fixture)
        working-directory: porca-madovbyk-ai
        run: python -m unittest tests.test_calendar_source.CalendarSourceTest.test_september_10_2026_resolves_matchday_4_not_5 -v

      # An old matchday cannot be asserted against a changing live homepage.
      # Fresh fixture source health is monitored separately without blocking unrelated features.
      - name: Current Serie A source health (non-blocking)
        continue-on-error: true
        working-directory: porca-madovbyk-ai
        run: |
          python - <<'PY'
          from src.calendar_source import detect_next_matchday, fetch_matchday_context
          matchday = detect_next_matchday()
          context = fetch_matchday_context(matchday=matchday)
          assert len(context["matches"]) == 10
          print("Current Serie A source: OK", matchday)
          PY

      - name: Probe live player detail source and role
        working-directory: porca-madovbyk-ai
        run: |
          python - <<'PY'
          from src.player_detail import fetch_player_detail

          detail = fetch_player_detail("Cristante")
          assert detail.get("profile_url"), detail
          assert detail.get("current_value") is not None, detail
          assert detail.get("games_with_vote") is not None, detail
          assert detail.get("usage") is not None, detail
          assert detail.get("role") == "C", detail
          print(
              "Player detail live: OK",
              detail.get("name"),
              detail.get("role"),
              detail.get("current_value"),
              detail.get("games_with_vote"),
          )
          PY

      - name: Verify stable FIA core imports
        working-directory: porca-madovbyk-ai
        run: |
          python -c "from src.decision_fia import player_fia, fia_decision_score; print('Dashboard V5.1 core: OK')"
